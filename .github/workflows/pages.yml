# Publishes the static visualizer (site/ plus the shared Python parser) to GitHub Pages.
#
# Manual only: nothing runs on push. It publishes nothing until the owner sets
# Settings -> Pages -> Build and deployment -> Source to "GitHub Actions"; until then the deploy
# job fails. docs/static-hosting.md has the steps.
name: Publish static visualizer

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read  # deploy-pages v4 and later ask for it

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runner and action versions are pinned on purpose: ubuntu-24.04 is the image the workflow was
  # checked on (ubuntu-latest moves to Ubuntu 26.04 on 2026-10-19), and each action is at its
  # current major version, all of which run on Node.js 24.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build the site
        run: python3 scripts/build_site.py
      - name: Check the export runs without test ROMs
        run: python3 -m unittest spoiler_test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5  # its upload-artifact v7 runs on Node.js 24
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
