# Publishes the static visualizer (site/ plus the shared Python parser) to GitHub Pages.
#
# Manual only: nothing runs on push. It publishes nothing until the owner sets
# Settings -> Pages -> Build and deployment -> Source to "GitHub Actions"; until then the deploy
# job fails. docs/static-hosting.md has the steps.
name: Publish static visualizer

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the site
        run: python3 scripts/build_site.py
      - name: Check the export runs without test ROMs
        run: python3 -m unittest spoiler_test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
